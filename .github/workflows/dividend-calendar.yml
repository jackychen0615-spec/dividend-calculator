name: 除息行事曆每日更新

# 每天台灣時間 08:30 跑 scripts/build_dividend_calendar.py：
# 只更新 cal/*.ics、data/dividend-events.json、當月除息頁表格、個股頁「下一次除息」那一行（都在標記之間）。
# 不改文章其他內容；資料沒變就不 commit。
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dividend-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 產生除息資料與行事曆
        run: python scripts/build_dividend_calendar.py

      - name: 有變動才 commit
        run: |
          git config user.name "gulicalc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cal data/dividend-events.json articles
          if git diff --cached --quiet; then
            echo "資料沒有變動，跳過。"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Update dividend calendar data ($(date -u +%F))"
          git push
